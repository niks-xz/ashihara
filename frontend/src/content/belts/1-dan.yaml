sections:
  - title: Кихон
    groups:
      - items:
          - Весь Кихон
  - title: Идо Кихон
    groups:
      - items:
          - Вся техника Идо Кихон
  - title: Ката
    groups:
      - items:
          - Kumite 5
          - Jissen 1
          - Nage 3
  - title: Сабаки
    groups:
      - items:
          - Вся техника Ашихара-каратэ против непрерывных поочередных атак 6-ти ассистентов
  - title: Кондиция, демонстрация силы ударов на снарядах
    groups:
      - items:
          - Серии из 3-х ударов руками и ногами (3 мин + 30 секунд отдых + 1 мин). Обязательно включить удары ногами в прыжке
  - title: Самооборона
    groups:
      - items:
          - Демонстрация техники самообороны против 15-20 нападений с использованием приёмов Ашихара-каратэ
          - Освобождение от захватов
          - Защита от неожиданных атак руками, ногами, головой
  - title: Техника владения оружием
    groups:
      - items:
          - Демонстрация техники владения оружием (по личному выбору)
  - title: Тамэши вари
    groups:
      - items:
          - 'Разбить стандартные доски одним из трёх способов: сэйкэн, сюто, хиджи'
          - Женщины - 1 доска
          - Мужчины - 2 доски
  - title: Кумитэ
    groups:
      - items:
          - Выдержать непрерывные бои по 1 минуте со свежим противником - 20 боёв
