name: 1 Кю
sortOrder: 10
beltColor: Коричневый
colorHex: '#92400E'
description: Коричневый пояс.
strengthTest:
  - exercise: Отжимание от пола на кулаках
    count: 100
  - exercise: Упражнения на пресс
    count: 100
  - exercise: Приседания
    count: 100
  - exercise: Подтягивание на перекладине
    count: 20
sections:
  - title: Кихон
    note: вся техника до 3 Кю включительно
    groups:
      - title: Удары руками из Киба дачи
        items:
          - Хиджи Агэ Учи (поднимающийся удар снизу вверх)
      - title: Удары руками из Санчин дачи
        items:
          - Шотэй Дзуки (прямой удар основанием ладони)
          - Тохо Дзуки (прямой удар в горло)
      - title: Удары ногами из Кумитэ дачи
        items:
          - Тоби Ёко Гэри(Только в лапу или мешок)
          - Тоби Уширо Гэри (Только в лапу или мешок)
          - Тоби Уширо Маваши Гэри
  - title: Идо Кихон
    note: перемещения на 3,5,10 шагов до 3 Кю включительно
    groups:
      - title: в Кумитэ дачи (применительно к левосторонней стойке)
        items:
          - Л Сэйкэн Аго Учи, П Уширо Маваши Хиджи (Уракэн, Шуто) Учи, шаг вперед со сменой стойки ( и зеркально)
          - Л Уширо Гэри, шаг вперед, П Дзёдан Уширо Маваши Гэри
          - Базовая комбинация Ашихара-каратэ
  - title: Технические приёмы
    groups:
      - items:
          - Техника перемещений в течение 1 минуты при нападении трех невооруженных противников.
  - title: Ката
    groups:
      - items:
          - Kumite 4
          - Nage 3
  - title: Сабаки
    groups:
      - items:
          - Вся техника Ашихара-каратэ против непрерывных поочередных атак 5-х ассистентов
  - title: Кондиция, демонстрация силы ударов на снарядах
    groups:
      - items:
          - Серии по 3 удара (3 мин + 30 секунд отдых + 1 мин). Обязательно включить удары ногами в прыжке
  - title: Самооборона
    groups:
      - items:
          - Освобождение от 10-12 различных захватов, используя технику Ашихара-каратэ
  - title: Кумитэ
    groups:
      - items:
          - Поединки с соперниками без перерыва по 1 минуте - 15
