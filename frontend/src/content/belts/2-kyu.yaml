name: 2 Кю
sortOrder: 9
beltColor: Коричневый
colorHex: '#92400E'
description: Коричневый пояс.
strengthTest:
  - exercise: Отжимание от пола на кулаках
    count: 80
  - exercise: Упражнения на пресс
    count: 80
  - exercise: Приседания
    count: 80
  - exercise: Подтягивание на перекладине
    count: 15
sections:
  - title: Кихон
    note: вся техника до 3 Кю включительно
    groups:
      - title: Удары руками из Киба дачи
        items:
          - Шуто Отоши Учи (в ключицу)
      - title: Удары ногами из Кумитэ дачи
        items:
          - Тоби Маэ Гэри(Только в лапу или мешок)
          - Тоби Хиза Гэри(Только в лапу или мешок)
          - Тоби Маваши Гэри
  - title: Идо Кихон
    note: перемещения на 3,5,10 шагов до 3 Кю включительно
    groups:
      - title: в Зэнкутсу дачи
        items:
          - Ой Дзуки с шагом назад
          - Гяку Дзуки с шагом назад
      - title: в Кумитэ дачи (применительно к левосторонней стойке)
        items:
          - От П Цуки – Л Сото Укэ, Л Уракэн Ганмэн Учи, П Хиджи Маваши Учи , шаг вперед со сменой стойки ( и зеркально)
          - П Уширо Гэри, шаг вперед, Л Дзёдан Маваши Гэри
          - Базовая комбинация Ашихара-каратэ
  - title: Технические приёмы
    groups:
      - items:
          - Защита без блоков (поглощение ударов- Кюшу, уходы, уклоны Микири, нырки, встречный вход – Ирими.). Ассистент должен атаковать с мягкими накладками на руках и на голени в течение 1 минуты.
  - title: Ката
    groups:
      - items:
          - Kihon 3
  - title: Сабаки
    groups:
      - items:
          - Вся техника Ашихара-каратэ против непрерывных поочередных атак 4-х ассистентов
  - title: Кондиция, демонстрация силы ударов на снарядах
    groups:
      - items:
          - Серии по 3 удара (3 мин + 30 секунд отдых + 1 мин). Обязательно включить удары ногами в прыжке
  - title: Кумитэ
    groups:
      - items:
          - Поединки с соперниками без перерыва по 1 минуте - 10
