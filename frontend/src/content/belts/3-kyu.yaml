name: 3 Кю
sortOrder: 8
beltColor: Зелёный
colorHex: '#16A34A'
description: Зелёный пояс.
strengthTest:
  - exercise: Отжимание от пола на кулаках
    count: 70
  - exercise: Упражнения на пресс
    count: 70
  - exercise: Приседания
    count: 70
  - exercise: Подтягивание на перекладине
    count: 12
sections:
  - title: Кихон
    note: вся техника до 5 Кю включительно
    groups:
      - title: Удары руками из Санчин дачи
        items:
          - Хайто Маваши Учи (внутренее ребро ладони)
          - Шотэй Маваши Учи (основание ладони)
      - title: Удары ногами из Кумитэ дачи
        items:
          - Л Керикоми Какэ Гэри, Л Уширо Маваши Какэ Гэри, П Керикоми Какэ Гэри, П Уширо Маваши Какэ Гэри
  - title: Идо Кихон
    note: перемещения на 3,5,10 шагов до 5 Кю включительно
    groups:
      - title: в Кумитэ дачи (применительно к левосторонней стойке)
        items:
          - Л Уракэн Ганмэн Учи, П Хиджи Учи , шаг
          - Л Чудан Ёко Гэри, П Дзёдан Уширо Маваши Гэри с разворотом на 360, П Лоу Кик, Л Дзёдан Уширо Маваши Гэри с разворотом на 360
          - 'Базовая комбинация : Маэ Гэри, шаг вперед, Нихон Цуки , Маваши Дзёдан Гэри, шаг вперед, Дзёдан Уширо Маваши Гэри с разворотом на 360, Лоу Кик, Маваши Укэ, Хиза Гэри, Хиджи Учи с разворотом на 180, Киай с постановкой ноги'
  - title: Технические приёмы
    groups:
      - items:
          - Техника контроля после стопинга
  - title: Ката
    groups:
      - items:
          - Kumite 3
  - title: Кондиция, демонстрация силы ударов на снарядах
    groups:
      - items:
          - Серии по 3 удара (3 мин + 30 секунд отдых + 1 мин)
  - title: Кумитэ
    groups:
      - items:
          - Поединки с соперниками без перерыва 1 мин. - х 8
