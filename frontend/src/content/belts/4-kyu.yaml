name: 4 Кю
sortOrder: 7
beltColor: Зелёный
colorHex: '#16A34A'
description: Зелёный пояс.
strengthTest:
  - exercise: Отжимание от пола на кулаках
    count: 60
  - exercise: Упражнения на пресс
    count: 60
  - exercise: Приседания
    count: 60
  - exercise: Подтягивание на перекладине
    count: 10
sections:
  - title: Кихон
    note: вся техника до 5 Кю включительно
    groups:
      - title: Удары руками из Санчин дачи
        items:
          - Шуто Сото Учи (внешнее ребро ладони)
          - Шуто Учи Учи
      - title: Удары ногами из Кумитэ дачи
        items:
          - Керикоми Какэ Гэри, Уширо Маваши Какэ Гэри
  - title: Идо Кихон
    note: перемещения на 3,5,10 шагов до 5 Кю включительно
    groups:
      - title: в Кумитэ дачи (применительно к левосторонней стойке)
        items:
          - Л Маваши Учи , П хиджи Учи , шаг
          - Л Чудан Ёко Гэри, П Дзёдан Маваши Гэри с шагом вперед, П Чудан Ёко Гэри, Л Дзёдан Маваши Гэри с шагом вперед
          - 'Базовая комбинация : Маэ Гэри, шаг вперед, Нихон Цуки , Маваши Дзёдан Гэри, шаг вперед, Дзёдан Уширо Маваши Гэри с разворотом на 360, Лоу Кик, Маваши Укэ, Хиза Гэри, Хиджи Учи с разворотом на 180, Киай с постановкой ноги'
  - title: Технические приёмы
    groups:
      - items:
          - Техника контроля после Хиккакэ (зацеп ногой)
  - title: Ката
    groups:
      - items:
          - Shoshin 3
          - Kihon 2
  - title: Кондиция, демонстрация силы ударов на снарядах
    groups:
      - items:
          - Серии по 3 удара (2 мин + 30 секунд отдых + 1 мин)
  - title: Кумитэ
    groups:
      - items:
          - Поединки с соперниками без перерыва 1 мин. - х 5
