name: 5 Кю
sortOrder: 6
beltColor: Жёлтый
colorHex: '#EAB308'
description: Жёлтый пояс.
strengthTest:
  - exercise: Отжимание от пола на кулаках
    count: 50
  - exercise: Упражнения на пресс
    count: 50
  - exercise: Приседания
    count: 50
  - exercise: Подтягивание на перекладине
    count: 9
sections:
  - title: Кихон
    note: вся техника до 7 Кю включительно
    groups:
      - title: Удары руками из Киба дачи
        items:
          - Тэтсуи Отоши Учи
      - title: Удары ногами из Кумитэ дачи
        items:
          - Уширо Маваши Какэ Гэри
  - title: Идо Кихон
    note: перемещения на 3,5,10 шагов до 7 Кю включительно
    groups:
      - title: в Киба дачи
        items:
          - На первый шаг П Хиджи Маваши Учи, П Дзёдан Учи Шуто Укэ, П Гэдан Барай, Л Гяку Дзуки На второй шаг Л Хиджи Маваши Учи, Л Дзедан Учи Шуто Укэ, Л Гэдан Барай, П Гяку Дзуки
      - title: в Кумитэ дачи (применительно к левосторонней стойке)
        items:
          - Л Цуки , П Цуки , Л Дзёдан Шита Дзуки , П Хиджи Маваши Учи, шаг вперед (и то же начиная с П руки)
          - 'Базовая комбинация : Маэ Гэри, шаг вперед, Нихон Цуки , Маваши Дзёдан Гэри, шаг вперед, Дзёдан Уширо Маваши Какэ Гэри с разворотом на 360, Лоу Кик, Маваши Укэ, Хиза Гэри, Хиджи Маваши Учи с разворотом на 180, Киай с постановкой ноги'
      - title: в Киба дачи
        items:
          - Уширо Гэри с разворотом на 180 и спостановкой ноги вперед
          - Уширо Маваши Гэри с разворотом на 180 с постановкой ноги вперед
  - title: Технические приёмы
    groups:
      - items:
          - Техника Хики Кудзуши (одной рукой)
  - title: Ката
    groups:
      - items:
          - Kumite 2
  - title: Кондиция, демонстрация силы ударов на снарядах
    groups:
      - items:
          - Серии по 3 удара (1,5 мин + 1,5 мин)
