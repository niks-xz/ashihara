name: 6 Кю
sortOrder: 5
beltColor: Жёлтый
colorHex: '#EAB308'
description: Жёлтый пояс.
strengthTest:
  - exercise: Отжимание от пола на кулаках
    count: 40
  - exercise: Упражнения на пресс
    count: 40
  - exercise: Приседания
    count: 40
  - exercise: Подтягивание на перекладине
    count: 8
sections:
  - title: Кихон
    note: вся техника до 7 Кю включительно
    groups:
      - title: Удары руками из Киба дачи
        items:
          - Хиджи Отоши Учи
      - title: Удары ногами из Кумитэ дачи
        items:
          - Кэрикоми Какэ Гэри (Spin Kick)
  - title: Идо Кихон
    note: перемещения на 3,5,10 шагов до 7 Кю включительно
    groups:
      - title: в Зэнкутсу дачи
        items:
          - На один шаг Ой Гэдан Цуки , Гяку Чудан Цуки , Ой Дзёдан Цуки
          - На один шаг Гяку Гэдан Цуки , Ой Чудан Цуки , Гяку Дзёдан Цуки
      - title: в Кумитэ дачи (применительно к левосторонней стойке)
        items:
          - Л Цуки , П Цуки , П Хиджи Маваши Учи, шаг вперед (и то же начиная с П руки)
          - 'Базовая комбинация : Маэ Гэри, шаг вперед, Нихон Цуки , Маваши Дзёдан Гэри, шаг вперед, Дзёдан Уширо Маваши Какэ Гэри с разворотом на 360, Лоу Кик, Маваши Укэ, Хиза Гэри, Хиджи Маваши Учи с разворотом на 180, Киай с постановкой ноги'
      - title: в Киба дачи
        items:
          - Ёко Гэри, шаг вперед с разворотом на 180
          - Какэ Гэри (Spin Kick) передней ногой с разворотом на 180
  - title: Технические приёмы
    groups:
      - items:
          - Техника Хики Маваши (двумя руками)
  - title: Ката
    groups:
      - items:
          - Nage 2
          - Shoshin 2
  - title: Кондиция, демонстрация силы ударов на снарядах
    groups:
      - items:
          - Серии по 3 удара (1 мин + 1 мин)
